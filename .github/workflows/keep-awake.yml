# Keeps the live demo awake for evaluators. Render's free server sleeps after 15 minutes without visitors and then
# takes about a minute to wake, so this visits both links every 5 minutes (GitHub may delay scheduled runs a little).
name: Keep the live demo awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Visit the MVP and the Discovery Engine
        run: |
          for url in https://rhythm-sip.onrender.com/healthz https://rhythm-sip.onrender.com/engine/_stcore/health; do
            for try in 1 2 3; do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 100 "$url" || true)
              if [ "$code" = "200" ]; then echo "$url ok"; break; fi
              echo "$url answered $code (try $try), retrying"; sleep 10
            done
          done
