# Backup wake-up for the live demo. The app keeps itself awake (keep_awake in rhythm_app.py visits its own public
# address every 4 minutes). GitHub runs scheduled jobs late or skips them (2 runs in the first 12 hours here), so this
# only matters if the server is ever asleep: it visits both links and waits for them to come up.
name: Keep the live demo awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Visit the MVP and the Discovery Engine
        run: |
          for url in https://rhythm-sip.onrender.com/healthz https://rhythm-sip.onrender.com/engine/_stcore/health; do
            for try in 1 2 3; do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 100 "$url" || true)
              if [ "$code" = "200" ]; then echo "$url ok"; break; fi
              echo "$url answered $code (try $try), retrying"; sleep 10
            done
          done
